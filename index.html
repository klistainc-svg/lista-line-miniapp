<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista 住まい相談</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
  <div id="message">
    Lista 住宅メーカー診断を準備しています...
  </div>

  <script>
    async function startApp() {
      try {
        await liff.init({
          liffId: '2011116569-vZzzguJe'
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const idToken = liff.getIDToken();

        if (!idToken) {
          document.getElementById('message').innerText =
            'LINE認証情報を取得できませんでした。';
          return;
        }

        const response = await fetch(
          'https://script.google.com/macros/s/AKfycbwCabSaORi7UCrhi7BtMD0a_rX_mFlLl0F7MrCC7broEI_G5PgoT4ieRrfFJHaAoZkUxQ/exec',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({
              idToken: idToken
            })
          }
        );

        const result = await response.json();

        if (result.success) {
          document.getElementById('message').innerText =
            'LINE連携を確認しました。';
        } else {
  document.getElementById('message').innerText =
    'LINE連携に失敗しました：' + (result.error || '詳細不明');
}

      } catch (error) {
        document.getElementById('message').innerText =
          'エラー：' + (error.code || '') + ' ' + (error.message || error);
      }
    }

    startApp();
  </script>
</body>
</html>
