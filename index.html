<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista 住まい相談</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
  <div id="message" style="text-align:center;margin-top:60px;font-family:sans-serif;">
    Lista 住まい相談を準備しています...
  </div>

<script>
const LIFF_ID = '2011116571-MIJ3JTGp';

const FORMS = {
  maker: {
    message: 'Lista 住宅メーカー診断を準備しています...',
    url: 'https://docs.google.com/forms/d/e/1FAIpQLSdhaBkAskqvZcl_ZwJ5qRw2eOUt7HZmYAhkPYB82vqKNfwcAg/viewform',
    entry: 'entry.1853739278'
  },

  sale: {
    message: 'Lista 不動産売却相談を準備しています...',
    url: 'https://docs.google.com/forms/d/e/1FAIpQLScTeG513euAXpLBC5anzAGrYnor_eXynllyy9e47G-wEe4Cfw/viewform',
    entry: 'entry.720146338'
  },

  property: {
    message: 'Lista 土地・物件探し相談を準備しています...',
    url: 'https://docs.google.com/forms/d/e/1FAIpQLScmwZhI2qH7f-ZgxPb0a7g7gZuVE9C6Uu7YJhXTXt7R0P_m3Q/viewform',
    entry: 'entry.997299105'
  },

  vacant: {
    message: 'Lista 相続・空き家相談を準備しています...',
    url: 'https://docs.google.com/forms/d/e/1FAIpQLSfRFDVYvMNVFPUP9BTzhhpx5_qlw0ZHTBzbdOIrkdpiaGcXAw/viewform',
    entry: 'entry.2125231539'
  }
};


function validType(value) {
  return ['maker', 'sale', 'property', 'vacant'].includes(value)
    ? value
    : '';
}


function readTypeFromUrl() {
  const params = new URLSearchParams(window.location.search);

  const directType = validType(params.get('type'));
  if (directType) return directType;

  const state = params.get('liff.state');

  if (state) {
    try {
      let decoded = state;

      for (let i = 0; i < 3; i++) {
        decoded = decodeURIComponent(decoded);
      }

      const question = decoded.indexOf('?');

      const query =
        question >= 0
          ? decoded.substring(question + 1)
          : decoded.replace(/^[/?#]+/, '');

      const stateParams = new URLSearchParams(query);

      const stateType = validType(stateParams.get('type'));

      if (stateType) return stateType;

    } catch (e) {
      console.log(e);
    }
  }

  return '';
}


async function start() {
  const message = document.getElementById('message');

  try {

    // LINEの1次リダイレクト時にも相談種別を保持
    const initialType = readTypeFromUrl();

    if (initialType) {
      sessionStorage.setItem('lista_consultation_type', initialType);
    }


    // LIFF初期化
    await liff.init({
      liffId: LIFF_ID
    });


    // LINEログイン
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }


    // LIFF初期化後のURLを優先
    const restoredType = readTypeFromUrl();

    const storedType = validType(
      sessionStorage.getItem('lista_consultation_type')
    );

    const type = restoredType || storedType;

    if (!type || !FORMS[type]) {
      message.innerText = 'リンク情報を確認できませんでした。';
      return;
    }


    const config = FORMS[type];

    message.innerText = config.message;


    // LINEユーザーID取得
    const profile = await liff.getProfile();

    const lineUserId = String(profile.userId || '').trim();

    if (!lineUserId) {
      message.innerText = 'LINEユーザー情報を取得できませんでした。';
      return;
    }


    // GoogleフォームへLINEユーザーID付きで転送
    const formUrl =
      config.url +
      '?usp=pp_url&' +
      config.entry +
      '=' +
      encodeURIComponent(lineUserId);


    sessionStorage.removeItem('lista_consultation_type');

    window.location.replace(formUrl);


  } catch (error) {
    console.error(error);

    message.innerText =
      'フォームを開けませんでした。画面を閉じて、もう一度お試しください。';
  }
}


start();
</script>

</body>
</html>
