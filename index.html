<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista 住まい相談</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
<div id="message"
     style="text-align:center;margin-top:60px;font-family:sans-serif;">
  Lista 住まい相談を準備しています...
</div>

<script>
const LIFF_ID = '2011116571-MIJ3JTGp';

const FORMS = {
  maker: {
    message: 'Lista 住宅メーカー診断を準備しています...',
    url: 'https://docs.google.com/forms/d/e/1FAIpQLSdhaBkAskqvZcl_ZwJ5qRw2eOUt7HZmYAhkPYB82vqKNfwcAg/viewform',
    entry: 'entry.1853739278'
  },

  sale: {
    message: 'Lista 不動産売却相談を準備しています...',
    url: 'https://docs.google.com/forms/d/e/1FAIpQLScTeG513euAXpLBC5anzAGrYnor_eXynllyy9e47G-wEe4Cfw/viewform',
    entry: 'entry.720146338'
  },

  property: {
    message: 'Lista 土地・物件探し相談を準備しています...',
    url: 'https://docs.google.com/forms/d/e/1FAIpQLScmwZhI2qH7f-ZgxPb0a7g7gZuVE9C6Uu7YJhXTXt7R0P_m3Q/viewform',
    entry: 'entry.997299105'
  },

  vacant: {
    message: 'Lista 相続・空き家相談を準備しています...',
    url: 'https://docs.google.com/forms/d/e/1FAIpQLSfRFDVYvMNVFPUP9BTzhhpx5_qlw0ZHTBzbdOIrkdpiaGcXAw/viewform',
    entry: 'entry.2125231539'
  }
};


function getType() {

  // ① #maker などを最優先
  const hash =
    window.location.hash
      .replace(/^#/, '')
      .trim();

  if (FORMS[hash]) {
    return hash;
  }


  // ② 従来の ?type= にも対応
  const params =
    new URLSearchParams(
      window.location.search
    );

  const queryType =
    params.get('type');

  if (FORMS[queryType]) {
    return queryType;
  }


  // ③ LINEの liff.state に残っている場合にも対応
  const state =
    params.get('liff.state');

  if (state) {

    let decoded = state;

    try {
      decoded =
        decodeURIComponent(decoded);
    } catch (e) {}


    const hashMatch =
      decoded.match(
        /#(maker|sale|property|vacant)/
      );

    if (hashMatch) {
      return hashMatch[1];
    }


    const queryMatch =
      decoded.match(
        /[?&]type=(maker|sale|property|vacant)/
      );

    if (queryMatch) {
      return queryMatch[1];
    }
  }


  return '';
}


async function start() {

  const message =
    document.getElementById('message');

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }


    const type =
      getType();


    if (!type || !FORMS[type]) {
      message.innerText =
        'リンク情報を確認できませんでした。';
      return;
    }


    const config =
      FORMS[type];

    message.innerText =
      config.message;


    const profile =
      await liff.getProfile();


    const lineUserId =
      String(
        profile.userId || ''
      ).trim();


    if (!lineUserId) {
      message.innerText =
        'LINEユーザー情報を取得できませんでした。';
      return;
    }


    const formUrl =
      config.url +
      '?usp=pp_url&' +
      config.entry +
      '=' +
      encodeURIComponent(lineUserId);


    window.location.replace(
      formUrl
    );


  } catch (error) {

    console.error(error);

    message.innerText =
      'フォームを開けませんでした。';
  }
}


start();
</script>
</body>
</html>
