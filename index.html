<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista 住まい相談</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
  <div id="message">
    Lista 住宅メーカー診断を準備しています...
  </div>

  <script>
    async function startApp() {
      try {
await liff.init({
  liffId: '2011116571-MIJ3JTGp'
});
const params = new URLSearchParams(window.location.search);
const type = params.get('type');
if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const idToken = liff.getIDToken();

        if (!idToken) {
          document.getElementById('message').innerText =
            'LINE認証情報を取得できませんでした。';
          return;
        }

        const response = await fetch(
          'https://script.google.com/macros/s/AKfycbwCabSaORi7UCrhi7BtMD0a_rX_mFlLl0F7MrCC7broEI_G5PgoT4ieRrfFJHaAoZkUxQ/exec',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({
              idToken: idToken
            })
          }
        );

        const result = await response.json();

        if (!result.success || !result.lineUserId) {
          document.getElementById('message').innerText =
            'LINE連携に失敗しました。';
          return;
        }

        const formUrl =
          'https://docs.google.com/forms/d/e/1FAIpQLSdhaBkAskqvZcl_ZwJ5qRw2eOUt7HZmYAhkPYB82vqKNfwcAg/viewform?usp=pp_url&entry.1853739278=' +
          encodeURIComponent(result.lineUserId);

        window.location.href = formUrl;

      } catch (error) {
        document.getElementById('message').innerText =
          'エラー：' + (error.message || error);
      }
    }

    startApp();
  </script>
</body>
</html>
